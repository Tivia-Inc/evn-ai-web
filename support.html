<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evn AI · 지원 · 자주 묻는 질문 · Support &amp; FAQ</title>
<style>
:root{--bg:#fff;--fg:#141a26;--muted:#5b6475;--line:#e3e6ec;--accent:#141a26;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--fg:#e9ecf2;--muted:#9aa3b2;--line:#2a303b;--accent:#e9ecf2;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,sans-serif;word-break:keep-all;overflow-wrap:anywhere}
header,main,footer{max-width:760px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
header a{color:var(--fg);font-weight:700;text-decoration:none}
.lang button{font:inherit;font-size:14px;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.lang button[aria-pressed=true]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
main{padding-top:8px;padding-bottom:40px}
h1{font-size:28px;line-height:1.3;margin:24px 0 8px}
h2{font-size:20px;margin:32px 0 8px}
h3{font-size:17px;margin:24px 0 6px}
a{color:inherit}
.t{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:14px;min-width:560px}
th,td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
footer{border-top:1px solid var(--line);padding-top:16px;padding-bottom:32px;color:var(--muted);font-size:14px}
footer a{color:var(--muted)}
.muted{color:var(--muted)}
</style>
</head>
<body>
<header><a href="./">Evn AI</a><nav class="lang"><button data-l="ko">한국어</button> <button data-l="en">English</button></nav></header>
<main>
<article lang="ko" data-l="ko">
<h1>지원 · 자주 묻는 질문</h1>
<p>Evn AI 출시 전에 이 주소에 게시합니다.</p>
<p class="muted">문의: <a href="mailto:admin@tivia.kr">admin@tivia.kr</a></p>
</article>
<article lang="en" data-l="en">
<h1>Support & FAQ</h1>
<p>This page will be published here before Evn AI launches.</p>
<p class="muted">Contact: <a href="mailto:admin@tivia.kr">admin@tivia.kr</a></p>
</article>
</main>
<footer>TIVIA Inc. · <a href="mailto:admin@tivia.kr">admin@tivia.kr</a> · <a href="terms">이용약관 Terms</a> · <a href="privacy">개인정보 처리방침 Privacy</a> · <a href="support">지원 Support</a></footer>
<script>
(function(){
  var q=new URLSearchParams(location.search).get('lang');
  var l=q||((navigator.language||'en').toLowerCase().indexOf('ko')===0?'ko':'en');
  function show(x){document.querySelectorAll('[data-l]').forEach(function(e){
    if(e.tagName==='ARTICLE'){e.hidden=e.dataset.l!==x}else{e.setAttribute('aria-pressed',String(e.dataset.l===x))}});
    document.documentElement.lang=x}
  document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){show(b.dataset.l)}});
  show(l==='ko'?'ko':'en');
})();
</script>
</body>
</html>
